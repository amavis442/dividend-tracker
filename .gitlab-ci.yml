# Cancel jobs of a branch pipeline that a newer commit made redundant;
# keep every pipeline on the default branch.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    # Jobs use only/except; skip merge request pipelines to avoid duplicates.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - analysis
  - test
  - deployment

default:
  interruptible: true
  image: phpdockerio/php:8.4-fpm
  services:
    - name: postgres:16-alpine
      alias: postgresql

cache:
  key: ${CI_COMMIT_REF_SLUG}
  policy: pull
  paths:
    - vendor/
    - node_modules/

variables:
  POSTGRES_DB: theapplication
  POSTGRES_USER: theapplication
  POSTGRES_PASSWORD: theapplication
  DATABASE_URL: 'postgresql://theapplication:theapplication@postgresql:5432/theapplication?serverVersion=16&charset=utf8'
  TEST_DATABASE_PORT: 5432
  TEST_DATABASE_HOST: postgresql
  GITHUB_API_TOKEN: "thisismysecrettoken"

static_analysis:
  stage: analysis
  script:
    - bash ci/php-install.sh
    - php composer.phar require --dev phpstan/phpstan
    - php vendor/bin/phpstan.phar analyse src/ -c phpstan.neon --level=5 --no-progress -vvv --memory-limit=1024M

phpunit:
  stage: test
  script:
    - bash ci/php-install.sh
    - php composer.phar install -o
    - php composer.phar require --dev symfony/phpunit-bridge
    - php bin/console tailwind:build
    - php bin/console asset-map:compile --no-debug
    - sh ci/php_test_run.sh
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    policy: pull-push
    paths:
      - node_modules

# Deploys run Deployer (deploy.php) from the runner over SSH; setup in DEPLOYMENT.md.
.deploy:
  stage: deployment
  # A deploy must never stop halfway.
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - bash ci/php-install.sh
    - php composer.phar install --no-interaction --no-progress

deploy:acceptance:
  extends: .deploy
  # Only after the tests and static analysis of this pipeline passed.
  needs: [static_analysis, phpunit]
  # One deploy per environment at a time.
  resource_group: acceptance
  environment:
    name: acceptance
  script:
    - sh ci/deploy.sh acceptance

deploy:production:
  extends: .deploy
  # Production is only possible after a successful acceptance deploy of the same pipeline.
  needs: [deploy:acceptance]
  resource_group: production
  environment:
    name: production
  script:
    - sh ci/deploy.sh production
